name: Check & Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Pull request checks are superseded by newer pushes to the
# same PR; runs on main (and therefore deployments) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # _slides/ is published as is. The landing page is hand-written, so make
      # sure every local link and asset in it points to a file that exists.
      - name: Check landing page links
        shell: bash
        run: |
          set -euo pipefail
          broken=0
          while IFS= read -r ref; do
            case "$ref" in
              http://*|https://*|//*|mailto:*|\#*) continue ;;
            esac
            file="_slides/${ref%%[#?]*}"
            if [ ! -e "$file" ]; then
              echo "::error file=_slides/index.html,title=Broken link::${ref} (${file} does not exist)"
              broken=1
            fi
          done < <(grep -oE '(href|src)="[^"]+"' _slides/index.html | sed -E 's/^(href|src)="(.*)"$/\2/')
          exit "$broken"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _slides/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
